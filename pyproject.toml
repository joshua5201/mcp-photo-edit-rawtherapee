[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "raw-edit-service"
version = "0.1.1"
description = "Typed in-process and CLI RAW rendering service"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "raw-edit-contracts>=0.1,<0.2",
]

[project.urls]
Homepage = "https://github.com/joshua5201/raw-edit-service"
Repository = "https://github.com/joshua5201/raw-edit-service"
Issues = "https://github.com/joshua5201/raw-edit-service/issues"

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "types-Pillow>=10,<13",
]

[project.scripts]
raw-edit-service = "raw_edit_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raw_edit_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["dist", "build"]
