[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-photo-edit-rawtherapee"
version = "0.1.0"
description = "Typed in-process and CLI RawTherapee adapter for mcp-photo-edit"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "mcp-photo-edit-core>=0.1,<0.2",
]

[project.urls]
Homepage = "https://github.com/joshua5201/mcp-photo-edit-rawtherapee"
Repository = "https://github.com/joshua5201/mcp-photo-edit-rawtherapee"
Issues = "https://github.com/joshua5201/mcp-photo-edit-rawtherapee/issues"

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "types-Pillow>=10,<13",
]

[project.scripts]
mcp-photo-edit-rawtherapee = "mcp_photo_edit_rawtherapee.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_photo_edit_rawtherapee"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["dist", "build"]
